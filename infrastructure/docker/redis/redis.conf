# ==============================================================================
# Redis Configuration for whatsapp_ai
# ==============================================================================

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (AOF + RDB)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Performance & Connections
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Security (Internal Docker Network Only)
protected-mode no
bind 0.0.0.0
