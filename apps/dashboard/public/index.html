<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property WhatsApp AI - Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      max-width: 480px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: #10b981;
      color: #064e3b;
      font-weight: 600;
      border-radius: 9999px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">SYSTEM READY</div>
    <h1>Property WhatsApp AI</h1>
    <p>Admin Dashboard service is online and healthy. Full React UI will be deployed in Phase 14.</p>
  </div>
</body>
</html>
